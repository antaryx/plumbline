name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.23"

jobs:
  verify:
    name: verify (fmt, vet, test, invariants)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: make verify
      - run: make test-race

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath ./...

  schema:
    name: schema validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - name: Schemas are themselves valid
        run: |
          python - <<'PY'
          import json, glob
          from jsonschema import Draft202012Validator
          for f in glob.glob("schema/*.json"):
              Draft202012Validator.check_schema(json.load(open(f)))
              print("ok", f)
          PY
      # From WP-11: validate every rendered document against findings-v1.
      # Until the renderer exists this job proves the schemas parse, which is
      # cheap and still catches a broken edit.

  offline:
    name: no network during scan
    runs-on: ubuntu-latest
    # From WP-13. The offline claim is central to the product, so it is a
    # test rather than a promise.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Placeholder until cmd/plumbline exists (WP-12)
        run: |
          if [ -d cmd/plumbline ]; then
            go build -o /tmp/plumbline ./cmd/plumbline
            sudo unshare -n /tmp/plumbline scan --root testdata/fixtures/sshd-include --format json > /dev/null
          else
            echo "cmd/plumbline not yet built; skipping (WP-12)"
          fi
