name: CI

# Every claim this project makes about itself is a job here. The point is not
# coverage for its own sake: a claim that is not tested decays silently, and the
# ones below are the load-bearing ones — the collect/evaluate split, the offline
# guarantee, determinism, the fixture rule, and the OS seam.
#
# Branch protection cannot be expressed in a workflow file. It is a repository
# setting, and WP-14 requires: every job below required, linear history, signed
# commits.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.23"

jobs:
  verify:
    name: verify (fmt, vet, test, invariants)
    runs-on: ubuntu-latest
    # `make verify` is the gate the whole project is written against, and it
    # carries three of WP-14's acceptance criteria on its own:
    #
    #   check-system-seam       blocks a PR that calls os.ReadFile outside
    #                           internal/system
    #   check-check-purity     blocks a check that imports a clock or a network
    #   check-fixture-coverage blocks a check added without PASS and FAIL fixtures
    #
    # It also runs the schema-validation and determinism tests, because those
    # live in `go test` rather than in a bespoke CI step: a gate that only runs
    # in CI is a gate contributors discover after pushing.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: make verify

  race:
    name: go test -race
    runs-on: ubuntu-latest
    # The collector runner runs independent branches concurrently and merges
    # into one fact set, and fact.Set is not safe for concurrent writes. A race
    # there corrupts an audit rather than crashing, which is the worst way for a
    # bug to behave, so this is a separate required job rather than a footnote.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go test -race ./... -count=1

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # Pinned rather than `latest`, and pinned to the last v1 release. The
      # config in .golangci.yml is v1 format; golangci-lint v2 requires a
      # `version: "2"` key and a restructured file, so `latest` would silently
      # flip the linter to a major that cannot read the config — which is
      # exactly how the G304 exclusion went missing once already.
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8

  build:
    name: build linux/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # CGO_ENABLED=0 is not an optimisation. It is what makes the release a
      # single static binary an operator can drop onto a host they do not
      # control, which is the deployment model an auditing tool has to support.
      # The integration job below proves the result actually runs on a musl
      # distribution.
      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -ldflags "-s -w" -o "dist/plumbline-linux-${GOARCH}" ./cmd/plumbline
          go build -trimpath ./...

      - name: Confirm the binary is statically linked
        if: matrix.goarch == 'amd64'
        run: |
          file "dist/plumbline-linux-amd64"
          if ldd "dist/plumbline-linux-amd64" 2>&1 | grep -qv 'not a dynamic executable'; then
            echo "::error::the binary is dynamically linked; it will not run on a musl distribution"
            ldd "dist/plumbline-linux-amd64" || true
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: plumbline-linux-${{ matrix.goarch }}
          path: dist/plumbline-linux-${{ matrix.goarch }}
          if-no-files-found: error

  schema:
    name: schema validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema

      # The published schemas must themselves be valid JSON Schema. `go test`
      # validates documents *against* them, which cannot catch a schema that is
      # malformed in a way that makes it vacuously permissive.
      - name: Schemas are themselves valid
        run: |
          python - <<'PY'
          import json, glob, sys
          from jsonschema import Draft202012Validator
          for f in sorted(glob.glob("schema/*.json")):
              Draft202012Validator.check_schema(json.load(open(f)))
              print("ok", f)
          PY

      # The schema is the public API (ADR-0007), so an accidental relaxation is
      # a silent breaking change. These two fields were made nullable
      # deliberately (ADR-0010) and must stay that way: a consumer that cannot
      # tell "unexamined" from "failed" is the bug that ADR prevents.
      - name: Posture and coverage remain nullable
        run: |
          python - <<'PY'
          import json, sys
          s = json.load(open("schema/findings-v1.schema.json"))
          props = s["properties"]["summary"]["properties"]
          for field in ("posture", "coverage"):
              t = props[field]["type"]
              if t != ["number", "null"]:
                  sys.exit(f"summary.{field} type is {t!r}; ADR-0010 requires ['number','null']")
              print("ok", field, t)
          PY

  offline:
    name: zero network during a scan
    runs-on: ubuntu-latest
    # WP-13. The offline guarantee is why a bundle can be collected on an
    # air-gapped host and why nothing here can leak an inventory to a vendor.
    # One dependency that phones home would end it with nothing failing to say
    # so, which is exactly what this job exists to notice.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # The Go tests build the binary themselves and run it under
      # `unshare -n -r`, after asserting the namespace really has no interfaces
      # so the test cannot pass on a host where unshare silently did nothing.
      - name: Offline tests
        run: go test ./cmd/plumbline/ -run 'WithNoNetwork|NoNetworkCall' -v -count=1

      # And again from the outside, so the guarantee does not depend on the test
      # harness being correct about its own namespace.
      - name: A real scan in a namespace with no network
        run: |
          go build -trimpath -o /tmp/plumbline ./cmd/plumbline
          sudo unshare -n -- /tmp/plumbline scan --root testdata/fixtures/cli-host > /tmp/findings.json
          grep -q '"schema": "findings/v1"' /tmp/findings.json
          grep -q '"result": "PASS"' /tmp/findings.json
          echo "a full scan completed with no network interfaces present"

  hostile:
    name: hostile input corpus
    runs-on: ubuntu-latest
    # WP-13. A FIFO, a 40-deep symlink chain, a symlink to /etc/shadow, a
    # 100 MB file, filenames carrying ANSI escapes, a self-including config.
    # These are generated at test time because they cannot live in git, and they
    # are called out as their own job because "no hang, no panic, no unbounded
    # read" is a claim someone will otherwise assume rather than check.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Seam-level hostile input
        run: go test ./internal/system/live/ -v -count=1
      - name: Parser-level hostile input
        run: go test ./internal/collect/collectors/sshd/ -v -count=1
      - name: Terminal-escape neutralisation
        run: go test ./internal/sanitize/ ./internal/catalog/ -v -count=1

  integration:
    name: scan on ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:24.04
          - debian:13
          - fedora:latest
          - alpine:3.20
    # The binary is run with `docker run` rather than in a `container:` job on
    # purpose: a container job needs a glibc node to run the checkout action,
    # which alpine does not have — and alpine is the image that matters most
    # here, because it is the one that proves the static linkage claim rather
    # than assuming it.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: plumbline-linux-amd64
          path: dist
      - run: chmod +x dist/plumbline-linux-amd64

      # A fixture root, so the verdict is identical on every distribution. If
      # this diverges, the difference is in the binary or the libc, not in the
      # host being scanned.
      - name: Deterministic scan of a fixture tree
        run: |
          docker run --rm -v "$PWD:/w" -w /w ${{ matrix.image }} \
            /w/dist/plumbline-linux-amd64 scan --root testdata/fixtures/cli-host > /tmp/out.json
          grep -q '"schema": "findings/v1"' /tmp/out.json
          grep -q '"check_id": "SSHD-0002"' /tmp/out.json
          grep -q '"result": "PASS"' /tmp/out.json
          grep -q '"coverage": 100' /tmp/out.json
          echo "identical verdict produced on ${{ matrix.image }}"

      # And the container's own filesystem, which is what an operator actually
      # points this at. The verdict differs per image and that is fine — that is
      # the point of running four of them; what must hold is that it runs, emits
      # a document that parses, and does not crash.
      - name: Scan the container's own root
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" ${{ matrix.image }} \
            /dist/plumbline-linux-amd64 scan > /tmp/self.json
          jq . /tmp/self.json > /dev/null
          grep -q '"schema": "findings/v1"' /tmp/self.json
          grep -q '"euid": 0' /tmp/self.json
          # This step deliberately asserts nothing about the verdict. It used to
          # require '"posture": null' — true when SSHD was the only module, so a
          # base image with no sshd produced NOT_APPLICABLE and nothing else. The
          # KERNEL and USERS modules changed that: every base image has /proc/sys
          # and /etc/passwd, so real checks now evaluate and posture is a real
          # number (81-95 across this matrix). The assertion was pinned to a
          # property of the catalog's size rather than to anything about the
          # binary, which is why it broke on a change that was working correctly.
          #
          # ADR-0010's null-vs-zero distinction is still covered, in the place
          # that can hold it steady: internal/score's unit tests.

      - name: version reports all three versions
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" ${{ matrix.image }} \
            /dist/plumbline-linux-amd64 version --json > /tmp/version.json
          grep -q '"tool": "plumbline"' /tmp/version.json
          grep -q '"catalog_version"' /tmp/version.json
          grep -q '"schema": "findings/v1"' /tmp/version.json

      # A bundle is a reconnaissance package. It is written 0600 by the code and
      # asserted by a unit test; this checks the same thing on each distribution,
      # because a umask or a filesystem could in principle interfere.
      - name: A bundle is written owner-only
        run: |
          docker run --rm -v "$PWD:/w" -w /w ${{ matrix.image }} sh -c '
            /w/dist/plumbline-linux-amd64 collect --root testdata/fixtures/cli-host -o /tmp/b.plb &&
            mode=$(stat -c %a /tmp/b.plb) &&
            echo "bundle mode: $mode" &&
            [ "$mode" = "600" ]'

      # collect on one machine, eval on another, is the architecture rather than
      # a convenience. Here the two halves run on different distributions, which
      # is the strongest form of the claim available in CI.
      - name: Evaluate a bundle collected elsewhere
        run: |
          mkdir -p /tmp/cross
          docker run --rm -v "$PWD:/w" -v /tmp/cross:/out -w /w ubuntu:24.04 \
            /w/dist/plumbline-linux-amd64 collect --root testdata/fixtures/cli-host -o /out/cross.plb
          docker run --rm -v /tmp/cross:/out:ro -v "$PWD/dist:/dist:ro" ${{ matrix.image }} \
            /dist/plumbline-linux-amd64 eval /out/cross.plb > /tmp/cross.json
          grep -q '"result": "PASS"' /tmp/cross.json
          echo "a bundle collected on ubuntu:24.04 evaluated cleanly on ${{ matrix.image }}"
