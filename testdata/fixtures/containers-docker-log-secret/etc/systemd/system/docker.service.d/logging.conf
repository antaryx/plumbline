# Every spelling of --log-opt dockerd will take, and one it will not, so the
# scrubber is exercised on all of them from a real file rather than a hand-built
# argv. splunk-token is a credential; max-size is not, and both go, because the
# rule is "the key is policy, the value is not" and not a list of bad words.
[Service]
ExecStart=
ExecStart=/usr/bin/dockerd -H fd:// \
  --log-driver=splunk \
  --log-opt splunk-token=secret123 \
  --log-opt=splunk-url=https://splunk.example.internal:8088 \
  -log-opt max-size=10m \
  --log-opt "splunk-index=host logs" \
  --log-opt $EXTRA_LOG_OPTS
