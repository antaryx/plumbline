# This file originated from systemd. Source route verification is set on every
# interface by pattern, and the "all" key is withheld from that pattern on
# purpose: the kernel takes the maximum of it and the interface's own value, so
# pinning it would take away the ability to lower filtering on one interface.
net.ipv4.conf.default.rp_filter = 2
net.ipv4.conf.*.rp_filter = 2
-net.ipv4.conf.all.rp_filter
