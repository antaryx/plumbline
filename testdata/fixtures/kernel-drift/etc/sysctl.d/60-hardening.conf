kernel.yama.ptrace_scope = 1
kernel.dmesg_restrict = 1
fs.suid_dumpable = 0
kernel.core_pattern = |/usr/lib/systemd/systemd-coredump %P %u %g %s %t %c %h
# A key this module does not probe: the parser must skip it without error,
# and no check may say anything about a parameter it never read.
kernel.not_a_real_parameter = 1
