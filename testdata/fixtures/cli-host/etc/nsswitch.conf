# Name Service Switch configuration, as Debian 12 ships it.
#
# This file is not decoration on this fixture, it is load-bearing. The CLI
# tests scan this tree through the LIVE seam, so every inode in it carries the
# uid and gid of whoever checked the repository out. Git cannot record
# ownership, so that uid is 1000 on one machine, 1001 on a GitHub runner and 0
# in a container — and only the first happens to match `alice` below in
# /etc/passwd.
#
# FILESYS-0010 asks whether every owner on the filesystem resolves. When the
# answer is no, it must decide whether the local files are the whole account
# database before it may call an owner stray, and without this file it cannot:
# a name service it never saw could resolve the uid, so it correctly returns
# UNKNOWN(ambiguous_system_state). That drops coverage below 100 on every
# machine whose uid is not 1000, which is what the gate tests here assert
# against. Declaring the local files authoritative lets the check reach a
# verdict — FAIL on a foreign checkout, PASS on a uid-1000 one — and a verdict
# is what coverage counts.
passwd:     files
group:      files
shadow:     files

hosts:      files dns
networks:   files

protocols:  db files
services:   db files
ethers:     db files
rpc:        db files

netgroup:   nis
