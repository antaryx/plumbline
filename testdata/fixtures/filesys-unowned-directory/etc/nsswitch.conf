# Identical ownership on disk to filesys-unowned, and one different word:
# passwd and group are served by SSSD as well as by the local files. uid 4242
# may therefore be a perfectly real directory account, and an offline scan has
# no way to ask. FILESYS-0010 must return UNKNOWN here, not FAIL.
passwd:     files sss
group:      files sss
shadow:     files sss

hosts:      files dns
