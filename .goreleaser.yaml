# GoReleaser configuration for Plumbline.
#
# docs/DEPLOYMENT.md is the human-facing account of build, sign, publish and
# verify; this file is the machine that does it. Where the two disagree, this
# file is what actually ran and the document is wrong.
#
# Three properties this configuration exists to hold, all of them things a
# security tool has to be able to demonstrate rather than assert:
#
#   - **A user can verify what they downloaded** without trusting this project's
#     infrastructure. Every artifact is signed with a keyless cosign identity
#     tied to the GitHub Actions workflow that produced it, and the signature
#     and certificate are published beside it.
#   - **A user can see what is inside it.** An SBOM per artifact, generated by
#     syft, so an operator can answer "does this binary contain X" without
#     taking anyone's word for it. This matters more here than for most tools:
#     the binary runs as root.
#   - **The build is reproducible.** No CGO, trimmed paths, and a build time
#     taken from the commit rather than the clock, so two builds of one tag
#     produce identical bytes and a third party can check that they do.
#
# Release: `git tag -a vX.Y.Z && git push origin vX.Y.Z`, which the release
# workflow picks up. Locally, `goreleaser release --snapshot --clean` builds
# everything without publishing or signing.

version: 2

project_name: plumbline

before:
  hooks:
    # Nothing ships from a tree that would not pass review. `make verify` is
    # the same gate a pull request faces, and running it here is what stops a
    # release being the one build nobody checked.
    - go mod tidy
    - make verify

builds:
  - id: plumbline
    main: ./cmd/plumbline
    binary: plumbline
    env:
      # Static, because a host auditor has to run on the host it is auditing —
      # including one whose libc it was not built against, and including a
      # rescue shell. It is also what lets the same binary run on Alpine.
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    # -trimpath removes the build machine's directory layout from the binary,
    # which is both a reproducibility requirement and a small privacy one.
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.buildVersion={{ .Version }}
      - -X main.commit={{ .ShortCommit }}
      # CommitDate, not Date: the clock moves between builds of one tag and the
      # commit does not, so this is what makes two builds byte-identical.
      - -X main.date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: plumbline
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE
      - NOTICE
      - LEGAL-DISCLAIMER.md
      - SECURITY.md
      - src: docs/CHECK-REFERENCE.md
        info:
          mode: 0644
      - src: docs/MODULE-CATALOG.md
        info:
          mode: 0644

# Distribution packages. An operator who installs from a package expects the
# package manager to be able to verify and remove it, which is the whole reason
# these exist alongside the tarball.
nfpms:
  - id: plumbline
    package_name: plumbline
    vendor: Antaryx
    homepage: https://github.com/antaryx/plumbline
    maintainer: Antaryx <san.shibu7734@gmail.com>
    description: |-
      Offline Linux Security Auditor.
      Plumbline inspects a Linux host's configuration and reports what is
      misconfigured, with the evidence attached, and says plainly what it could
      not determine. It makes no network connections, applies no changes, and
      writes a durable evidence bundle that can be re-evaluated later.
    license: Apache-2.0
    section: admin
    priority: optional
    formats: [deb, rpm]
    # No dependencies: the binary is static by design and the package should
    # say so rather than pulling a libc in behind it.
    contents:
      - src: LICENSE
        dst: /usr/share/doc/plumbline/LICENSE
      - src: NOTICE
        dst: /usr/share/doc/plumbline/NOTICE
      - src: LEGAL-DISCLAIMER.md
        dst: /usr/share/doc/plumbline/LEGAL-DISCLAIMER.md
      - src: docs/CHECK-REFERENCE.md
        dst: /usr/share/doc/plumbline/CHECK-REFERENCE.md
      - src: docs/MODULE-CATALOG.md
        dst: /usr/share/doc/plumbline/MODULE-CATALOG.md
    rpm:
      group: Applications/System
    deb:
      # A package installed on a host being audited should not be the thing
      # that changes the host. No maintainer scripts, no services, no timers.
      fields:
        Bug: https://github.com/antaryx/plumbline/issues

# One SBOM per artifact, generated from what was actually built rather than
# from go.mod. The dependency list is short on purpose — four modules — and
# publishing it is how that claim becomes checkable instead of a sentence in a
# README.
sboms:
  - id: archive
    artifacts: archive
    documents:
      - "{{ .ArtifactName }}.sbom.spdx.json"
  - id: package
    artifacts: package
    documents:
      - "{{ .ArtifactName }}.sbom.spdx.json"

checksum:
  name_template: checksums.txt

# Keyless signing. There is no private key to leak, rotate or lose, and the
# certificate records the workflow, the repository and the commit that produced
# the artifact — which is a stronger statement than "somebody with the key
# signed this".
#
# Verify a download with:
#
#   cosign verify-blob plumbline_1.0.0_linux_amd64.tar.gz \
#     --signature plumbline_1.0.0_linux_amd64.tar.gz.sig \
#     --certificate plumbline_1.0.0_linux_amd64.tar.gz.pem \
#     --certificate-identity-regexp 'https://github.com/antaryx/plumbline/.*' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
signs:
  - cmd: cosign
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

release:
  draft: false
  # A release candidate is marked as one. An operator who installs "latest"
  # should get a release, and an rc tag that published as stable would be this
  # project making a claim it has not earned yet.
  prerelease: auto
  header: |
    ## Plumbline {{ .Version }}

    Offline Linux security auditing: deterministic, evidence-first, and honest
    about what it could not see.

    Every artifact below is signed and carries an SBOM. Verification steps are
    in [docs/DEPLOYMENT.md](https://github.com/antaryx/plumbline/blob/main/docs/DEPLOYMENT.md).
  footer: |
    **Plumbline produces evidence, not compliance conclusions.** See
    [LEGAL-DISCLAIMER.md](https://github.com/antaryx/plumbline/blob/main/LEGAL-DISCLAIMER.md).

changelog:
  # The changelog is written by hand in CHANGELOG.md, because a list of commit
  # subjects is not an account of what changed for a user — and this project
  # requires a `### Check corrections` section whenever a verdict moved, which
  # no generator can infer.
  disable: true
