# This file is in golangci-lint **v1** configuration format, and the pinning in
# .github/workflows/ci.yml has to stay on a v1 line for it to load.
#
# v2 introduced a mandatory `version: "2"` key and moved `linters-settings` to
# `linters.settings` and `issues.exclude-rules` to `linters.exclusions.rules`. A
# `version: "2"` key was previously present here without the rest of that
# migration, which a v1 binary rejects outright with
# `additional properties "version" not allowed` — the whole file goes unread,
# taking the G304 exclusion below with it. Whoever moves the action to v7/v8
# must migrate this file in the same commit.

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - nilerr
    - revive
    - unconvert
    - wastedassign

linters-settings:
  gosec:
    excludes:
      # G304: file inclusion via variable. Reading variable paths IS the job.
      # The safety controls are in internal/system/live (O_NOFOLLOW, regular-file
      # verification after open, size caps) and are covered by the hostile-input
      # corpus, not by avoiding the pattern. See docs/THREAT-MODEL.md T-01, T-02.
      - G304
  errcheck:
    check-type-assertions: true
  revive:
    rules:
      - name: exported
        disabled: false

issues:
  exclude-rules:
    - path: _test\.go
      linters: [gosec, errcheck]
  max-issues-per-linter: 0
  max-same-issues: 0
