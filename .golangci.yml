# golangci-lint **v2** configuration. The pinned version in
# .github/workflows/ci.yml must stay on a v2 line for this file to load.
#
# Migrated from v1 by `golangci-lint migrate` (v2.13.1), not by hand. The
# `exclusions.presets` block below is not new policy: v1 applied that default
# exclusion list unless `issues.exclude-use-default: false` was set, and this
# file never set it, so the presets are the migrator writing down what was
# already in force.
#
# errcheck, govet, ineffassign, staticcheck and unused are absent from `enable`
# because v2 turns them on by default. They are still running — `golangci-lint
# linters` lists thirteen enabled, the same thirteen as before.
#
# A version mismatch here is silent and expensive: a v1 binary rejects a v2 file
# outright with `additional properties "version" not allowed`, the whole file
# goes unread, and the G304 exclusion below goes with it. That has happened once
# already.

version: "2"
run:
  tests: true
linters:
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - nilerr
    - revive
    - unconvert
    - wastedassign
  settings:
    errcheck:
      check-type-assertions: true
    gosec:
      excludes:
        - G304
    revive:
      rules:
        - name: exported
          disabled: false
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - gosec
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
